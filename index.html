<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀵코인 바로가기</title>
  <style>
    body {
      margin: 0;
      background-color: #5865F2;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      z-index: 2;
    }

    .button {
      background-color: white;
      color: #5865F2;
      text-decoration: none;
      padding: 15px 30px;
      font-weight: bold;
      border-radius: 10px;
      font-size: 1.1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 2;
    }

    .discord-icon {
      position: absolute;
      width: 40px;
      opacity: 0.1;
    }

    /* 랜덤 위치의 디스코드 로고 배경 여러 개 */
    .icon1 { top: 10%; left: 10%; }
    .icon2 { top: 20%; right: 15%; }
    .icon3 { bottom: 25%; left: 5%; }
    .icon4 { bottom: 15%; right: 10%; }
    .icon5 { top: 50%; left: 45%; }

    /* 아이콘 이미지: Discord 로고 링크 */
    .discord-icon img {
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- 디스코드 로고 배경 아이콘 -->
  <div class="discord-icon icon1"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"></div>
  <div class="discord-icon icon2"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"></div>
  <div class="discord-icon icon3"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"></div>
  <div class="discord-icon icon4"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"></div>
  <div class="discord-icon icon5"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"></div>

  <!-- 중앙 텍스트 + 버튼 -->
  <h1>퀵코인 바로가기</h1>
  <a class="button" href="https://discord.gg/서버코드">서버 바로가기</a>
</body>
</html>
